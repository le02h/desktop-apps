[project]
name = "Pomodoro"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Leonardo Zhang", email = "leo.zh.pc@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pyside6>=6.12.0",
]

[project.scripts]
focusclockqt = "pomodoro:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-qt>=4.5.0",
    "ruff>=0.17.6",
]
